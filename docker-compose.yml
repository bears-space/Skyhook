version: "3.9"

services:
  backend:
    build: ./skyhook-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    devices:
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/spidev0.1:/dev/spidev0.1"
    group_add:
      - spi


  frontend:
    build: ./skyhook-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

